name: 问题反馈
description: 报告执行、寻路或界面问题
title: "[问题] "
body:
  - type: input
    id: version
    attributes:
      label: 模块版本与构建编号
      description: 在“更多与排错”中查看。
    validations:
      required: true
  - type: input
    id: task
    attributes:
      label: 书名、任务名与地图位置
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 发生了什么
      description: 描述预期行为、实际状态，以及可重复的操作。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖版本与相关截图
      description: 附上Omni、BMR、AutoDuty、vnavmesh版本。截图请遮挡角色名、聊天与个人信息。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前
      options:
        - label: 已检查内容，不包含账号、令牌或完整个人配置文件。
          required: true
